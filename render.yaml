services:
  - type: web
    name: polymer-similarity-explorer
    runtime: docker
    plan: free
    autoDeployTrigger: commit
    healthCheckPath: /api/health
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /data
      - key: CACHE_DIR
        value: /data/cache
      - key: DATASET_PATH
        value: /data/chembl_22_clean_1576904_sorted_std_final.smi
